apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: detran-poc-template
  title: Detran POC Template
  description: Creates a vahicle plate recognition POC for DETRAN-DF
  tags:
    - recommended
    - python
    - ai
    - rhoai
    - jupyter
spec:
  owner: hpfeffer
  type: service
  parameters:
    - title: Provide Information for Application
      required:
        - component_id
      properties:
        component_id:
          title: Name
          type: string
          description: Unique name of the component
          default: detran-poc
          ui:field: EntityNamePicker
          maxLength: 30
        description:
          title: Description
          type: string
          description: Help others understand what this POC is for.
          default: A cool POC for DETRAN-DF
    - title: Provide Image Registry Information
      required:
        - image_registry
      properties:
        image_registry:
          title: Image Registry
          type: string
          default: Quay
          enum:
            - Quay
      dependencies:
        image_registry:
          oneOf:
            - properties:
                image_registry:
                  enum:
                    - Quay
                image_host:
                  title: Image Host
                  type: string
                  description: The host URL for the Quay.io container registry where the application image will be stored and pulled from
                  default: QUAY_HOST
                image_organization:
                  title: Organization
                  type: string
                  description: Name of the Quay Organization
                  default: quayadmin
                image_tag:
                  title: Image Tag
                  default: latest
                  type: string
                  description: Build Image tag
    - title: Application repository Information
      required:
        - repo
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: Repo Host
              type: string
              description: Your SCM host
              default: GITLAB_HOST
              enum:
                - GITLAB_HOST
            owner:
              title: Repo Owner
              type: string
              description: The organization or group name in your Source Code Management (SCM) system where the repository will be created. This should be an existing group/organization that you have permissions to create repositories in.
              default: GITLAB_DESTINATION_GROUP
              enum:
                - GITLAB_DESTINATION_GROUP
            verify_commits:
              title: Verify Commits
              type: string
              description: Verify Git repository commits using Red Hat’s Trusted Artifact Signer (TAS) service
              default: disabled
              enum:
                - enabled
                - disabled

  steps:
    - id: template
      name: Fetch Skeleton + Template
      action: fetch:template
      input:
        url: ./skeleton
        copyWithoutTemplating:
          - .github/workflows/*
        values:
          component_id: {{ '${{ parameters.component_id }}' }}
          description: {{ '${{ parameters.description }}' }}
          namespace: {{ '${{ parameters.component_id }}' }}-dev
          group_id: {{ '${{ parameters.group_id }}' }}
          artifact_id: {{ '${{ parameters.artifact_id }}' }}
          java_package_name: {{ '${{ parameters.java_package_name }}' }}
          owner: {{ '${{ user.entity.metadata.name }}' }}
          cluster: CLUSTER_SUBDOMAIN
          host: {{ '${{ parameters.repo.host }}' }}
          destination: {{ '${{ parameters.repo.owner }}' }}/{{ '${{ parameters.component_id }}' }}
          quay_destination: {{ '${{ parameters.image_organization}}' }}/{{ '${{ parameters.component_id }}' }}
          port: 8080
          verify_commits: {{ '${{ parameters.repo.verify_commits }}' }}
          model_name: {{ '${{ parameters.model_name }}' }}
          model_max_length: {{ '${{ parameters.model_max_length }}' }}

    - id: publish
      name: Publish
      action: publish:gitlab
      input:
        repoUrl: "{{ '${{ parameters.repo.host }}' }}?owner={{ '${{ parameters.repo.owner }}' }}&repo={{ '${{parameters.component_id}}' }}"
        repoVisibility: public

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: {{ '${{ steps.publish.output.repoContentsUrl }}' }}
        catalogInfoPath: "/catalog-info.yaml"

    - id: template-gitops-deployment
      name: Generating Deployment Resources
      action: fetch:template
      input:
        url: ./manifests
        copyWithoutTemplating: []
        values:
          component_id: {{ '${{ parameters.component_id }}' }}
          description: {{ '${{ parameters.description }}' }}
          destination: https://{{ '${{ parameters.repo.host }}' }}/{{ '${{ parameters.repo.owner }}' }}/{{ '${{parameters.component_id}}' }}-gitops.git
          source_repository: https://{{ '${{ parameters.repo.host }}' }}/{{ '${{ parameters.repo.owner }}' }}/{{ '${{parameters.component_id}}' }}.git
          repository_name: {{ '${{parameters.component_id}}' }}
          git_owner: {{ '${{ parameters.repo.owner }}' }}
          cluster: CLUSTER_SUBDOMAIN
          namespace: {{ '${{ parameters.component_id }}' }}-dev
          image_registry: {{ '${{ parameters.image_registry }}' }}
          image_host: {{ '${{ parameters.image_host }}' }}
          image_organization: {{ '${{ parameters.image_organization }}' }}
          image_name: {{ '${{ parameters.component_id }}' }}
          image_tag: {{ '${{ parameters.image_tag }}' }}
          port: 8080
          repository_host: {{ '${{ parameters.repo.host }}' }}
          deployment_name: quarkus-template
          user: {{ '${{ user.entity.metadata.name }}' }}
          verify_commits: {{ '${{ parameters.repo.verify_commits }}' }}
          model_name: {{ '${{ parameters.model_name }}' }}
          model_max_length: {{ '${{ parameters.model_max_length }}' }}
        targetPath: ./tenant-gitops

    - id: publish-gitops
      name: Publishing to Resource Repository
      action: publish:gitlab
      input:
        repoUrl: "{{ '${{ parameters.repo.host }}' }}?owner={{ '${{ parameters.repo.owner }}' }}&repo={{ '${{parameters.component_id}}' }}-gitops"
        title: gitops resources for {{ '${{ parameters.component_id }}' }}
        description: gitops resources for {{ '${{ parameters.component_id }}' }}
        sourcePath: ./tenant-gitops
        repoVisibility: public

    - id: create-argocd-resources
      name: Create ArgoCD Resources
      action: argocd:create-resources
      input:
        appName: {{ '${{ parameters.component_id }}' }}-bootstrap
        argoInstance: main
        namespace: janus-argocd
        repoUrl: https://{{ '${{ parameters.repo.host }}' }}/{{ '${{ parameters.repo.owner }}' }}/{{ '${{ parameters.component_id }}' }}-gitops.git
        path: 'argocd/'

  output:
    links:
      - title: Source Code Repository
        url: {{ '${{ steps.publish.output.remoteUrl }}' }}
      - title: Open Component in catalog
        icon: catalog
        entityRef: {{ '${{ steps.register.output.entityRef }}' }}
